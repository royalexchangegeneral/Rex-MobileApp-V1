name: rex_insurance
description: A comprehensive general insurance platform
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.1
  image_picker: ^1.0.7
  
  # Utilities
  shared_preferences: ^2.2.2
  http: ^1.1.0
  url_launcher: ^6.2.4
  share_plus: ^12.0.2
  youtube_player_flutter: ^9.1.1
  flutter_paystack_plus: ^1.1.3
  webview_flutter: ^4.4.2
  webview_flutter_android: ^4.10.15
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  local_auth: ^2.1.8
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.2
  pdf: ^3.10.8
  file_picker: ^8.0.0
  safe_device: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/rex.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/rex.png"
  min_sdk_android: 21
  remove_alpha_ios: true
